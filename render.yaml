# Render deployment configuration
# https://render.com/docs/blueprint-spec
# 
# After connecting your GitHub repo, Render will read this file automatically.

services:
  - type: web
    name: sacco-backend
    runtime: python
    region: frankfurt  # EU; change to oregon for US
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install --legacy-peer-deps && npm run build && cd ..
      python manage.py collectstatic --noinput
    startCommand: gunicorn sacco.wsgi --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false  # set manually in Render dashboard
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # set to your Vercel frontend URL
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # set to your Vercel frontend URL
      - key: DATABASE_URL
        fromDatabase:
          name: sacco-db
          property: connectionString
      - key: SUPERUSER_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_BASE_URL
        sync: false  # set to your Render app URL (https://sacco-backend.onrender.com)
      - key: MPESA_REGISTRATION_FEE
        value: "500"
      - key: CRB_PROVIDER
        value: stub
      - key: SACCO_NAME
        value: "Nairobi West Transport Cooperative Society"
      - key: SACCO_SHORT_NAME
        value: "NW Transport"
      - key: SACCO_PHONE
        value: "0758007127"
      - key: SACCO_EMAIL
        value: "info@nwtcs.co.ke"
      - key: SACCO_PAYBILL
        value: "174379"
      - key: WELFARE_PRIVATE_ROOT
        value: /opt/render/project/src/private/welfare

databases:
  - name: sacco-db
    region: frankfurt
    databaseName: sacco
    plan: free  # upgrade to starter for production
